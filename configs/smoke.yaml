name: smoke-explicit-agents
seeds: [11]
output_dir: results/smoke
warmup_agents: 1000
repetitions: 1
generator:
  n_agents: 5000
  n_resources: 4
  n_clusters: 8
  seed: 11
  pattern: correlated_bursts
  duration_mode: unit
  duration_mean: 1.0
  duration_sigma: 0.25
  dominant_low: 70.0
  dominant_high: 110.0
  background_low: 3.0
  background_high: 12.0
  jitter_sigma: 0.12
  burst_concentration: 60.0
  dtype: float32
provider:
  capacities: [25000.0, 25000.0, 25000.0, 25000.0]
  resource_names: [cpu, memory, network, accelerator]
  name: smoke-provider
scheduler:
  methods: [mp, omp, ols, fista, irls, windowed_fifo, kahn, langchain_policy, langgraph_policy]
  fifo_window: 2048
  strict_fifo: false
  objective: makespan
  adaptive_sample_size: 5000
  adaptive_threshold: 0.1
  adaptive_seed: 0
  candidate:
    pool_size: 2048
    chunk_size: 1024
    local_top_k: 512
    direction_budget: 8
    direction_pool_size: 256
    refill_rounds: 4
    score_epsilon: 1.0e-12
    deterministic: true
  solver:
    max_iterations: 32
    tolerance: 1.0e-6
    l1_lambda: 0.02
    irls_p: 0.5
    irls_epsilon: 0.001
    irls_outer_iterations: 6
    irls_inner_iterations: 16
    positive: true
    normalize_columns: true
simulation:
  mode: waves
  record_trace: false
  validate_every_dispatch: true
  max_dispatches: null
  event_tolerance: 1.0e-10
distributed:
  backend: local
  workers: 1
  start_method: spawn
  shard_size: 1024
  temp_dir: null
