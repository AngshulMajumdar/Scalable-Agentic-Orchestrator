[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-agent-orchestrator"
version = "0.1.0"
description = "Sparse optimization schedulers for millions of explicit heterogeneous agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Angshul Majumdar"}]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
fast = ["numba>=0.60", "scipy>=1.12"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
dev = ["ruff>=0.8", "mypy>=1.12", "build>=1.2"]

[project.scripts]
sparse-orchestrator = "sparse_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
