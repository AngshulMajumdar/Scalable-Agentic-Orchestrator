name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[fast,test]'
      - run: pytest
      - run: sparse-orchestrator run configs/smoke.yaml --output results/ci-smoke
      - run: python scripts/validate_results.py results/ci-smoke/raw.csv --agents 5000
